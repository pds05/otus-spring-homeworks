spring:
  data:
    mongodb:
      database: test
  shell:
    interactive:
      enabled: false
mongock:
  runner-type: "ApplicationRunner"
  migration-scan-package: "ru.otus.hw.mongock.changeunits"
  enabled: false
  mongo-db:
    write-concern:
      journal: false
    read-concern: local
logging:
  level:
    org:
      springframework:
        boot:
          autoconfigure:
            mongo:
              embedded: debug
    mongodb: debug
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.5