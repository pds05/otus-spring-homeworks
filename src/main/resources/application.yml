spring:
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  #    defer-datasource-initialization: true
  datasource:
    url: jdbc:h2:mem:maindb
    driverClassName: org.h2.Driver
  shell:
    command:
      stacktrace:
        enabled: true
  sql:
    init:
      mode: always
      data-locations: data.sql
      schema-locations: schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
      