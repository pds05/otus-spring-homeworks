<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit book</title>
    <style type="text/css">
        body {
            padding: 50px;
        }

        label {
            display: inline-block;
            width: 100px;
        }

        h3 {
            padding: 2px;
            padding-left: 30px;
        }

        .row {
            margin-top: 10px;
        }

        .book {
            border: 1px solid steelblue;
            width: 300px;
            border-collapse: collapse;
        }

        .book tr td, th {
            padding: 5px;
            border: 1px solid steelblue;
        }

        .book td:last-child, td:first-child {
            width: 50px;
        }

        ul {
            width: 80px;
            padding-left: 25px;
        }
    </style>
</head>
<body>
<h3>Book info:</h3>
<div>
    <table class="book" th:object="${book}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Genres</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td th:text="*{id}">1</td>
            <td th:text="*{title}">Title</td>
            <td th:text="*{author.fullName}">Author</td>
            <td>
                <ul th:each="genre : *{genres}">
                    <li th:text="${genre.name}">Genre</li>
                </ul>
            </td>
            <td>
                <a th:href="@{edit(id=*{id})}" href="book_edit.html">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="row">
    <a href="books.html" th:href="@{/book}">
        <button type="button">View books</button>
    </a>
</div>

<div class="row" th:if="not ${#lists.isEmpty(userComments)}">
    <h3>User comments:</h3>
    <ul th:each="userComment: ${userComments}">
        <li th:text="${userComment.text}"></li>
    </ul>
</div>

</body>
</html>
