<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit book</title>
    <style type="text/css">
        body {
            padding: 50px;
        }

        label {
            display: inline-block;
            width: 100px;
        }

        input:read-only {
            background: lightgray;
        }

        .row {
            margin-top: 10px;
        }

        h3 {
            background-image: url("../static/listmark.png");
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }

        .errors {
            color: red;
        }
    </style>

    <style type="text/css" th:inline="text">
        [[h3]] {
            background-image: url([[@{/listmark.png}]]);
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }
    </style>
</head>
<body>

<!--/*@thymesVar id="book" type="ru.otus.hw.dtos.BookDto"*/-->
<!--/*@thymesVar id="genre" type="ru.otus.hw.dtos.GenreDto"*/-->
<!--/*@thymesVar id="author" type="ru.otus.hw.dtos.AuthorDto"*/-->
<form id="book-edit-form" action="book_edit.html" th:action="@{/book/edit}" th:method="post" th:object="${book}">
    <h3>Book details:</h3>

    <div class="row" th:if="*{id}">
        <label for="book-id-input">ID:</label>
        <input id="book-id-input" readonly="readonly" th:field="*{id}" >
    </div>

    <div class="row">
        <label for="book-title-input">Title:</label>
        <input id="book-title-input" th:field="*{title}"/>
        <div class="errors"
             th:if="${#fields.hasErrors('title')}"
             th:errors="*{title}">Wrong book title error</div>
    </div>

    <div class="row">
        <label for="book-author-select">Author:</label>
        <select id="book-author-select" name="authorId">
            <option th:each="author : ${allAuthors}"
                    th:selected="${book.author eq author}"
                    th:value="${author.id}"
                    th:text="${author.fullName}">Author</option>
        </select>
    </div>

    <div class="row">
        <label for="book-genres-select">Genres:</label>
        <select id="book-genres-select" name="genreIds" multiple="multiple">
            <option th:each="genre : ${allGenres}"
                    th:selected="${#lists.contains(book.genres, genre)}"
                    th:value="${genre.id}"
                    th:text="${genre.name}">Genre</option>
        </select>
    </div>

    <div class="row">
        <button type="submit">Save</button>
        <a href="books.html" th:href="@{/book}">
            <button type="button">Cancel</button>
        </a>
    </div>
</form>
<form id="book-delete-form" action="book_edit.html" th:action="@{/book/delete}" th:method="post" th:object="${book}">
    <input id="hidden=book-id-input" type="hidden" name="bookId" th:value="*{id}" value="1">
    <div class="row">
        <button th:if="*{id}" type="submit">Delete</button>
    </div>
</form>
</body>
</html>
