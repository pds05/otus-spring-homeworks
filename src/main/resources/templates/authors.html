<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List of all authors</title>
    <style type="text/css">
        body {
            padding: 50px;
        }

        .authors {
            border: 1px solid steelblue;
            width: 300px;
            border-collapse: collapse;
        }

        .authors tr td, th {
            padding: 5px;
            border: 1px solid steelblue;
        }

        .authors td:last-child, td:first-child {
            width: 50px;
        }

        .row {
            margin-top: 10px;
        }

        h3 {
            background-image: url("../static/listmark.png");
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }

    </style>

    <style type="text/css" th:inline="text">
        [[h3]] {
            background-image: url([[@{/listmark.png}]]);
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }
    </style>
</head>
<body>
    <h3>Authors:</h3>

    <table class="authors">
        <thead>
        <tr>
            <th>ID</th>
            <th>Full name</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="author : ${allAuthors}">
            <td th:text="${author.id}">1</td>
            <td th:text="${author.fullName}">Full Name</td>
        </tr>
        </tbody>
    </table>

    <div class="row">
        <a href="index.html" th:href="@{/}">
            <button type="button">Back</button>
        </a>
    </div>
</body>
</html>
