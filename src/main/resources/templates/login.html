<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
<meta charset="UTF-8">
<title>Library</title>
</head>
<body>
    <div th:if="${param.error}">
        <div>Invalid user or password</div>
    </div>
    <div th:if="${param.logout}">
        <div> You have been logged out.</div>
    </div>

    <h1>Login page</h1>
    <form th:action="@{/process-login}" method="post">
        <div><label>Username: </label><input type="text" name="username" placeholder="Enter login"></div>
        <div><label>Password: </label><input type="password" name="password" placeholder="Enter password"></div>
        <div><button name="submit" type="submit" >Login</button></div>
    </form>
</body>
</html>
