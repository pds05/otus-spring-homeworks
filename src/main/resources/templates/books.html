<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:td="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List of all books</title>
    <style type="text/css">
        body {
            padding: 50px;
        }

        .books {
            border: 1px solid steelblue;
            width: 300px;
            border-collapse: collapse;
        }

        .books tr td, th {
            padding: 5px;
            border: 1px solid steelblue;
        }

        .books td:last-child, td:first-child {
            width: 50px;
        }

        .row {
            margin-top: 10px;
        }

        h3 {
            padding: 2px;
            padding-left: 30px;
        }

        ul {
            width: 80px;
            padding-left: 25px;
        }
    </style>

    <style type="text/css" th:inline="text">
        [[h3]] {
            background-image: url([[@{/listmark.png}]]);
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }
    </style>

    <script>
        function fillBookTable(books) {
            let bookTable = document.getElementById("booksTable").getElementsByTagName('tbody')[0]

            books.forEach(book => {
                    let row = bookTable.insertRow();

                    let titleCell = row.insertCell();
                    titleCell.textContent = book.title;
                    let authorCell = row.insertCell();
                    authorCell.textContent = book.author.fullName;
                    let genreCell = row.insertCell();
                    genreCell.innerHTML = "<ul id='genreList_" + book.id + "'></ul>"
                    let genreList = document.getElementById("genreList_" + book.id);
                    book.genres.forEach(
                        genre => genreList.innerHTML += "<li>" + genre.name + "</li>"
                    )
                    let editCell = row.insertCell();
                    editCell.innerHTML = "<a href='book/edit?id=" + book.id + "'>Edit</a>";
                    let infoCell = row.insertCell();
                    infoCell.innerHTML = "<a href='book/" + book.id + "'>Info</a>";
                }
            )
        }
    </script>

    <script>
        function getBook() {
            fetch('http://localhost:8080/library/api/book')
                .then(response => response.json())
                .then(json => fillBookTable(json));
        }
    </script>
</head>
<body onload="getBook()">
<h3>Books:</h3>

<table id="booksTable" class="books">
    <thead>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Genres</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>
<div class="row">
    <a href="book_edit.html" th:href="@{/book/edit}">
        <button type="button">Add book</button>
    </a>

    <a href="index.html" th:href="@{/}">
        <button type="button">Back</button>
    </a>
</div>
</body>
</html>
